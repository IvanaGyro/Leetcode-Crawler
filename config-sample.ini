# The crawler also stores an exact LastSubmissionTimestamp here after a
# successful run. Leave LastUpdate at the Unix epoch to crawl everything.
[Record]
LastUpdate = 19700101_000000

[User]
# A username or email is accepted.
Username = your_leetcode_username_or_email
Password = your_leetcode_password

[Git]
# Commit changed files and push when submissions/ is inside a Git worktree.
# Use --no-push for a local-only run.
Push = true

[Browser]
# Keep this false so CAPTCHA/Turnstile challenges can be completed if they appear.
Headless = false
Channel = chrome
LoginTimeoutSeconds = 300
# Bounds simultaneous solution downloads. Request starts remain spaced by
# RequestDelaySeconds across all workers.
ConcurrentDownloads = 8
RequestDelaySeconds = 0.25
