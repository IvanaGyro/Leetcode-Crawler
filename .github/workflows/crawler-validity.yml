name: Crawler validity

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    # Every four hours at minute 17, keeping reusable login state fresh.
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crawler-validity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # For pull_request events, this is GitHub's synthetic merge of the PR
      # head into its current base, rather than the PR head alone.
      - name: Check out the tested revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the PR includes its main base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git merge-base --is-ancestor "$BASE_SHA" HEAD

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          frozen: true
          cache: true
          cache-write: ${{ github.event_name == 'schedule' }}

      - name: Restore Patchright Chromium
        id: browser-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: >-
            patchright-chromium-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pyproject.toml') }}

      - name: Install Patchright Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pixi run install-browser

      - name: Save Patchright Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}

      - name: Run unit tests
        run: pixi run test

      # Changing the LeetCode account or proxy list starts with a fresh profile
      # archive instead of carrying obsolete proxy directories forward.
      - name: Identify login-state cache scope
        id: login-scope
        env:
          LEETCODE_USERNAME: ${{ secrets.LEETCODE_USERNAME }}
          LEETCODE_PROXY_LIST: ${{ secrets.LEETCODE_PROXY_LIST }}
        run: |
          set -euo pipefail
          scope="$(printf '%s\0%s' "$LEETCODE_USERNAME" "$LEETCODE_PROXY_LIST" \
            | sha256sum | cut -d ' ' -f 1)"
          echo "::add-mask::$scope"
          echo "value=$scope" >> "$GITHUB_OUTPUT"

      - name: Restore encrypted login state
        id: login-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/leetcode-login-state.tar.gz.enc
          key: >-
            leetcode-login-state-v2-${{ runner.os }}-${{ steps.login-scope.outputs.value }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            leetcode-login-state-v2-${{ runner.os }}-${{ steps.login-scope.outputs.value }}-

      - name: Decrypt cached login state
        if: steps.login-cache.outputs.cache-matched-key != ''
        env:
          LEETCODE_CACHE_PASSWORD: ${{ secrets.LEETCODE_PASSWORD }}
        run: |
          set -euo pipefail
          encrypted="${RUNNER_TEMP}/leetcode-login-state.tar.gz.enc"
          archive="${RUNNER_TEMP}/leetcode-login-state.tar.gz"
          extract_dir="${RUNNER_TEMP}/leetcode-login-state-extract"
          profile="${RUNNER_TEMP}/leetcode-browser-profile"
          if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "$encrypted" -out "$archive" \
            -pass env:LEETCODE_CACHE_PASSWORD 2>/dev/null; then
            echo "::warning::Cached login state could not be decrypted; logging in again."
            rm -f "$encrypted" "$archive"
            exit 0
          fi
          rm -rf -- "$extract_dir"
          mkdir -p "$extract_dir"
          if ! tar -xzf "$archive" -C "$extract_dir"; then
            echo "::warning::Cached login state could not be extracted; logging in again."
            rm -f "$encrypted" "$archive"
            rm -rf -- "$extract_dir"
            exit 0
          fi
          extracted_profile="${extract_dir}/leetcode-browser-profile"
          if [[ ! -d "$extracted_profile" ]]; then
            echo "::warning::Cached login state did not contain a browser profile; logging in again."
            rm -f "$encrypted" "$archive"
            rm -rf -- "$extract_dir"
            exit 0
          fi
          rm -rf -- "$profile"
          mv "$extracted_profile" "$profile"
          rmdir "$extract_dir"
          rm -f "$encrypted" "$archive"

      - name: Check 50 live submissions
        id: live-check
        env:
          LEETCODE_USERNAME: ${{ secrets.LEETCODE_USERNAME }}
          LEETCODE_PASSWORD: ${{ secrets.LEETCODE_PASSWORD }}
          LEETCODE_PROXY_LIST: ${{ secrets.LEETCODE_PROXY_LIST }}
        run: >-
          xvfb-run --auto-servernum
          pixi run crawl
          --headed
          --browser-channel ""
          --browser-profile "${{ runner.temp }}/leetcode-browser-profile"
          --login-timeout-seconds 20
          --non-interactive
          --no-push
          --check 50

      # TODO(PR #11): exclude pull_request runs from both publishing steps
      # before merge. PR publishing is temporarily enabled for validation.
      - name: Encrypt refreshed login state
        id: prepare-login-cache
        if: always() && steps.live-check.outcome != 'skipped'
        env:
          LEETCODE_CACHE_PASSWORD: ${{ secrets.LEETCODE_PASSWORD }}
        run: |
          set -euo pipefail
          profile="${RUNNER_TEMP}/leetcode-browser-profile"
          archive="${RUNNER_TEMP}/leetcode-login-state.tar.gz"
          encrypted="${RUNNER_TEMP}/leetcode-login-state.tar.gz.enc"
          if [[ ! -d "$profile" ]]; then
            echo "::warning::No browser profile was created; skipping login-state cache."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Volatile Chromium GPU caches are not login state and do not need
          # to be restored.
          tar -czf "$archive" \
            --exclude="*/ShaderCache/*" \
            --exclude="*/GrShaderCache/*" \
            --exclude="*/GPUCache/*" \
            --exclude="*/DawnGraphiteCache/*" \
            --exclude="*/DawnWebGPUCache/*" \
            -C "$RUNNER_TEMP" leetcode-browser-profile
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "$archive" -out "$encrypted" \
            -pass env:LEETCODE_CACHE_PASSWORD
          rm -f "$archive"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Save encrypted login state
        if: always() && steps.prepare-login-cache.outputs.ready == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/leetcode-login-state.tar.gz.enc
          key: >-
            leetcode-login-state-v2-${{ runner.os }}-${{ steps.login-scope.outputs.value }}-${{ github.run_id }}-${{ github.run_attempt }}
