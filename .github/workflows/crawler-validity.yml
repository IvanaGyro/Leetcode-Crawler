name: Crawler validity

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    # Every four hours at minute 17, keeping reusable login state fresh.
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crawler-validity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-check:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      # For pull_request events, this is GitHub's synthetic merge of the PR
      # head into its current base, rather than the PR head alone.
      - name: Check out the tested revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the PR includes its main base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git merge-base --is-ancestor "$env:BASE_SHA" HEAD

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          frozen: true
          cache: true
          cache-write: ${{ github.event_name == 'schedule' }}

      - name: Run unit tests
        run: pixi run test

      - name: Restore encrypted login state
        id: login-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/leetcode-login-state.tar.gz.enc
          key: >-
            leetcode-login-state-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            leetcode-login-state-v1-${{ runner.os }}-

      - name: Decrypt cached login state
        if: steps.login-cache.outputs.cache-matched-key != ''
        env:
          LEETCODE_CACHE_PASSWORD: ${{ secrets.LEETCODE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $encrypted = Join-Path $env:RUNNER_TEMP "leetcode-login-state.tar.gz.enc"
          $archive = Join-Path $env:RUNNER_TEMP "leetcode-login-state.tar.gz"
          & openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 `
            -in $encrypted -out $archive `
            -pass env:LEETCODE_CACHE_PASSWORD 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::warning::Cached login state could not be decrypted; logging in again."
            Remove-Item -LiteralPath $encrypted, $archive `
              -Force -ErrorAction SilentlyContinue
            exit 0
          }
          & tar -xzf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) {
            throw "Cached login state could not be extracted."
          }
          Remove-Item -LiteralPath $encrypted, $archive -Force

      - name: Check 50 live submissions
        id: live-check
        env:
          LEETCODE_USERNAME: ${{ secrets.LEETCODE_USERNAME }}
          LEETCODE_PASSWORD: ${{ secrets.LEETCODE_PASSWORD }}
          LEETCODE_PROXY_LIST: ${{ secrets.LEETCODE_PROXY_LIST }}
        run: >-
          pixi run crawl
          --headed
          --browser-channel=
          --browser-profile "${{ runner.temp }}/leetcode-browser-profile"
          --login-timeout-seconds 20
          --non-interactive
          --no-push
          --check 50

      # TODO(PR #11): exclude pull_request runs from both publishing steps
      # before merge. PR publishing is temporarily enabled for validation.
      - name: Encrypt refreshed login state
        id: prepare-login-cache
        if: always() && steps.live-check.outcome != 'skipped'
        env:
          LEETCODE_CACHE_PASSWORD: ${{ secrets.LEETCODE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $profile = Join-Path $env:RUNNER_TEMP "leetcode-browser-profile"
          $archive = Join-Path $env:RUNNER_TEMP "leetcode-login-state.tar.gz"
          $encrypted = Join-Path $env:RUNNER_TEMP "leetcode-login-state.tar.gz.enc"
          if (-not (Test-Path -LiteralPath $profile -PathType Container)) {
            Write-Output "::warning::No browser profile was created; skipping login-state cache."
            "ready=false" | Out-File -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 -Append
            exit 0
          }
          # Chromium may briefly retain Windows file locks on volatile GPU
          # caches. They are not login state and do not need to be restored.
          & tar -czf $archive `
            --exclude="*/ShaderCache/*" `
            --exclude="*/GrShaderCache/*" `
            --exclude="*/GPUCache/*" `
            --exclude="*/DawnGraphiteCache/*" `
            --exclude="*/DawnWebGPUCache/*" `
            -C $env:RUNNER_TEMP leetcode-browser-profile
          if ($LASTEXITCODE -ne 0) {
            throw "Browser profile could not be archived."
          }
          & openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 `
            -in $archive -out $encrypted `
            -pass env:LEETCODE_CACHE_PASSWORD
          if ($LASTEXITCODE -ne 0) {
            throw "Browser profile could not be encrypted."
          }
          Remove-Item -LiteralPath $archive -Force
          "ready=true" | Out-File -FilePath $env:GITHUB_OUTPUT `
            -Encoding utf8 -Append

      - name: Save encrypted login state
        if: always() && steps.prepare-login-cache.outputs.ready == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/leetcode-login-state.tar.gz.enc
          key: >-
            leetcode-login-state-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
